<svg width="1600" height="750" viewBox="0 0 1600 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F3A1B"/>
      <stop offset="55%" stop-color="#145225"/>
      <stop offset="100%" stop-color="#1B7A33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#289845" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#289845" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D42929" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D42929" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="750" fill="url(#bg)"/>
  <circle cx="1250" cy="375" r="380" fill="url(#glow1)"/>
  <circle cx="120" cy="375" r="300" fill="url(#glow2)"/>

  <!-- All content kept inside a centered safe band (roughly y=195 to y=555) so object-cover
       cropping on real viewport aspect ratios never cuts it off. -->

  <!-- Fare estimate card mockup, vertically centered -->
  <g transform="translate(1130,195)">
    <rect x="0" y="0" width="300" height="360" rx="32" fill="#0F3A1B" opacity="0.35"/>
    <rect x="13" y="13" width="274" height="334" rx="24" fill="url(#cardGrad)"/>
    <rect x="36" y="42" width="140" height="14" rx="7" fill="#E8E8E8"/>
    <rect x="36" y="66" width="90" height="10" rx="5" fill="#E8E8E8"/>

    <circle cx="246" cy="54" r="20" fill="#1B7A33"/>
    <path d="M237,54 L243,60 L256,46" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="36" y="104" width="228" height="104" rx="16" fill="#F5F5F5"/>
    <g transform="translate(56,132)">
      <rect x="0" y="44" width="16" height="26" rx="3" fill="#289845"/>
      <rect x="24" y="26" width="16" height="44" rx="3" fill="#1B7A33"/>
      <rect x="48" y="6" width="16" height="64" rx="3" fill="#289845"/>
      <rect x="72" y="36" width="16" height="34" rx="3" fill="#1B7A33"/>
      <rect x="96" y="20" width="16" height="50" rx="3" fill="#289845"/>
      <rect x="120" y="44" width="16" height="26" rx="3" fill="#1B7A33"/>
      <rect x="144" y="30" width="16" height="40" rx="3" fill="#289845"/>
    </g>

    <rect x="36" y="230" width="228" height="1" fill="#E8E8E8"/>
    <rect x="36" y="250" width="76" height="11" rx="5" fill="#E8E8E8"/>
    <rect x="36" y="270" width="130" height="19" rx="6" fill="#1B7A33"/>
    <rect x="36" y="303" width="228" height="40" rx="12" fill="#D42929"/>
    <rect x="54" y="318" width="110" height="10" rx="5" fill="#FFFFFF"/>
  </g>

  <!-- Copy block, vertically centered to match the card -->
  <text x="90" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#8FE0A6">SOUTH INDIA, DOOR TO DOOR</text>
  <text x="86" y="330" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF">Book outstation cabs</text>
  <text x="86" y="398" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF">in minutes</text>
  <text x="90" y="444" font-family="Arial, sans-serif" font-size="20" fill="#E7F5EC" opacity="0.85">Transparent pricing, verified drivers, zero surprises.</text>

  <g transform="translate(90,478)">
    <rect x="0" y="0" width="210" height="58" rx="29" fill="#FFFFFF"/>
    <text x="32" y="37" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#145225">Book now</text>
    <circle cx="178" cy="29" r="15" fill="#1B7A33"/>
    <path d="M172,29 L184,29 M178,23 L184,29 L178,35" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
