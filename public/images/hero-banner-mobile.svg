<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0F3A1B"/>
      <stop offset="55%" stop-color="#145225"/>
      <stop offset="100%" stop-color="#1B7A33"/>
    </linearGradient>
    <radialGradient id="glow1m" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#289845" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#289845" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2m" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D42929" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D42929" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="900" fill="url(#bgm)"/>
  <circle cx="650" cy="200" r="280" fill="url(#glow1m)"/>
  <circle cx="120" cy="760" r="260" fill="url(#glow2m)"/>

  <!-- Everything below sits inside a safe band (y=230 to y=820) so the fixed navbar up top and
       any object-cover cropping never touch it. Content is centered within that band. -->

  <text x="400" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#8FE0A6">SOUTH INDIA, DOOR TO DOOR</text>
  <text x="400" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">Book outstation</text>
  <text x="400" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">cabs in minutes</text>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E7F5EC" opacity="0.85">Transparent pricing, verified drivers.</text>

  <g transform="translate(300,598)">
    <rect x="0" y="0" width="200" height="56" rx="28" fill="#FFFFFF"/>
    <text x="30" y="36" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#145225">Book now</text>
    <circle cx="168" cy="28" r="14" fill="#1B7A33"/>
    <path d="M163,28 L174,28 M168,23 L174,28 L168,33" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
