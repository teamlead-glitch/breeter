<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0F3A1B"/>
      <stop offset="55%" stop-color="#145225"/>
      <stop offset="100%" stop-color="#1B7A33"/>
    </linearGradient>
    <radialGradient id="glow1m" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#289845" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#289845" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2m" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D42929" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D42929" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGradm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="url(#bgm)"/>
  <circle cx="650" cy="200" r="280" fill="url(#glow1m)"/>
  <circle cx="120" cy="760" r="260" fill="url(#glow2m)"/>

  <!-- Everything below sits inside a safe band (y=230 to y=820) so the fixed navbar up top and
       any object-cover cropping never touch it. -->

  <text x="60" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#8FE0A6">SOUTH INDIA, DOOR TO DOOR</text>
  <text x="58" y="322" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">Book outstation</text>
  <text x="58" y="382" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">cabs in minutes</text>
  <text x="60" y="424" font-family="Arial, sans-serif" font-size="18" fill="#E7F5EC" opacity="0.85">Transparent pricing, verified drivers.</text>

  <g transform="translate(60,452)">
    <rect x="0" y="0" width="200" height="56" rx="28" fill="#FFFFFF"/>
    <text x="30" y="36" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#145225">Book now</text>
    <circle cx="168" cy="28" r="14" fill="#1B7A33"/>
    <path d="M163,28 L174,28 M168,23 L174,28 L168,33" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fare estimate card mockup -->
  <g transform="translate(160,552)">
    <rect x="0" y="0" width="480" height="248" rx="28" fill="#0F3A1B" opacity="0.35"/>
    <rect x="12" y="12" width="456" height="224" rx="20" fill="url(#cardGradm)"/>
    <rect x="34" y="36" width="150" height="14" rx="7" fill="#E8E8E8"/>
    <rect x="34" y="60" width="96" height="10" rx="5" fill="#E8E8E8"/>

    <circle cx="418" cy="50" r="20" fill="#1B7A33"/>
    <path d="M409,50 L415,56 L428,42" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="34" y="94" width="412" height="86" rx="14" fill="#F5F5F5"/>
    <g transform="translate(54,116)">
      <rect x="0" y="38" width="18" height="24" rx="3" fill="#289845"/>
      <rect x="28" y="24" width="18" height="38" rx="3" fill="#1B7A33"/>
      <rect x="56" y="6" width="18" height="56" rx="3" fill="#289845"/>
      <rect x="84" y="32" width="18" height="30" rx="3" fill="#1B7A33"/>
      <rect x="112" y="16" width="18" height="46" rx="3" fill="#289845"/>
      <rect x="140" y="38" width="18" height="24" rx="3" fill="#1B7A33"/>
      <rect x="168" y="26" width="18" height="36" rx="3" fill="#289845"/>
    </g>

    <rect x="34" y="198" width="180" height="18" rx="6" fill="#1B7A33"/>
  </g>
</svg>
